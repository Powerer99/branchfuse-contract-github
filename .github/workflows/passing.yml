name: PHPUnit (passing tests)

# A green run for trying out BranchFuse: the same suite without the tests tagged #[Group('known-bugs')].
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (passing tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit --exclude-group known-bugs
